<!DOCTYPE html>
<html lang="es" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (() => {
      const root = document.documentElement;
      root.classList.remove("no-js");

      try {
        const params = new URLSearchParams(window.location.search);
        const queryMode = params.get("intro");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const alreadyPlayed = sessionStorage.getItem("ls-hero-intro-played") === "true";

        if (queryMode !== "0" && !reducedMotion && (queryMode === "1" || !alreadyPlayed)) {
          root.classList.add("hero-motion-pending");
        }
      } catch {
        root.classList.add("hero-motion-pending");
      }

      window.setTimeout(() => {
        window.dispatchEvent(new CustomEvent("hero-motion-timeout"));
        root.classList.remove("hero-motion-pending");
      }, 4000);
    })();
  </script>
  <style>
    html.hero-motion-pending [data-hero-intro] {
      opacity: 0;
    }
  </style>
  <noscript>
    <style>
      [data-hero-intro] {
        opacity: 1 !important;
      }
    </style>
  </noscript>
