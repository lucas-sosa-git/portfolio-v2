<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura visual del Gestor de Turnos IDS</title>
  <desc id="desc">Mockup de agenda con flujo entre frontend, backend, base de datos, autenticacion JWT y Supabase Storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111216"/>
      <stop offset=".55" stop-color="#21181a"/>
      <stop offset="1" stop-color="#3b1115"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ef"/>
      <stop offset="1" stop-color="#e8ded0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="46" fill="url(#bg)"/>
  <path d="M0 640 C160 560 260 720 430 620 C590 526 740 640 900 548 C1010 486 1110 522 1200 466 L1200 760 L0 760 Z" fill="#f37676" opacity=".13"/>

  <g filter="url(#shadow)">
    <rect x="92" y="84" width="1016" height="592" rx="28" fill="#17181d" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="92" y="84" width="1016" height="74" rx="28" fill="#25262d"/>
    <circle cx="134" cy="122" r="9" fill="#e9444a"/>
    <circle cx="166" cy="122" r="9" fill="#f6b85b"/>
    <circle cx="198" cy="122" r="9" fill="#5dd68a"/>
    <text x="232" y="130" font-family="Rubik, Arial, sans-serif" font-size="24" font-weight="700" fill="#f3f4f6">Gestor de Turnos IDS</text>
  </g>

  <g transform="translate(132 194)">
    <rect width="396" height="410" rx="24" fill="url(#panel)"/>
    <text x="30" y="50" font-family="Rubik, Arial, sans-serif" font-size="30" font-weight="800" fill="#17181d">Agenda</text>
    <text x="30" y="84" font-family="Rubik, Arial, sans-serif" font-size="17" font-weight="600" fill="#7b2121">Reserva, confirmacion y QR</text>

    <g transform="translate(30 118)" font-family="Rubik, Arial, sans-serif">
      <rect width="336" height="56" rx="14" fill="#fff"/>
      <rect x="18" y="17" width="22" height="22" rx="5" fill="#e9444a"/>
      <text x="56" y="35" font-size="18" font-weight="700" fill="#17181d">Cliente reserva turno</text>

      <rect y="78" width="336" height="56" rx="14" fill="#fff"/>
      <rect x="18" y="95" width="22" height="22" rx="5" fill="#f37676"/>
      <text x="56" y="113" font-size="18" font-weight="700" fill="#17181d">Profesional valida QR</text>

      <rect y="156" width="336" height="56" rx="14" fill="#fff"/>
      <rect x="18" y="173" width="22" height="22" rx="5" fill="#d52a2a"/>
      <text x="56" y="191" font-size="18" font-weight="700" fill="#17181d">Admin gestiona ABM</text>
    </g>
  </g>

  <g transform="translate(604 208)" font-family="Rubik, Arial, sans-serif">
    <g>
      <rect width="188" height="94" rx="20" fill="#f3f4f6"/>
      <text x="24" y="39" font-size="20" font-weight="800" fill="#17181d">Frontend</text>
      <text x="24" y="66" font-size="16" fill="#4b5563">Flask / Jinja</text>
    </g>
    <g transform="translate(258 0)">
      <rect width="188" height="94" rx="20" fill="#f3f4f6"/>
      <text x="24" y="39" font-size="20" font-weight="800" fill="#17181d">Backend</text>
      <text x="24" y="66" font-size="16" fill="#4b5563">Flask API</text>
    </g>
    <path d="M198 47 H248" stroke="#f37676" stroke-width="5" stroke-linecap="round"/>
    <path d="M240 36 L252 47 L240 58" fill="none" stroke="#f37676" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(0 154)">
      <rect width="188" height="94" rx="20" fill="#25262d" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="24" y="39" font-size="20" font-weight="800" fill="#f3f4f6">JWT / Roles</text>
      <text x="24" y="66" font-size="16" fill="#d6d6d6">admin cliente pro</text>
    </g>
    <g transform="translate(258 154)">
      <rect width="188" height="94" rx="20" fill="#25262d" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="24" y="39" font-size="20" font-weight="800" fill="#f3f4f6">SQL</text>
      <text x="24" y="66" font-size="16" fill="#d6d6d6">turnos usuarios</text>
    </g>
    <g transform="translate(129 304)">
      <rect width="188" height="94" rx="20" fill="#25262d" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="24" y="39" font-size="20" font-weight="800" fill="#f3f4f6">Storage</text>
      <text x="24" y="66" font-size="16" fill="#d6d6d6">imagenes Supabase</text>
    </g>

    <path d="M94 94 V144" stroke="#f37676" stroke-width="4" stroke-linecap="round"/>
    <path d="M352 94 V144" stroke="#f37676" stroke-width="4" stroke-linecap="round"/>
    <path d="M352 248 C352 288 223 268 223 304" stroke="#f37676" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
